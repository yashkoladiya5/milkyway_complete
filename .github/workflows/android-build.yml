name: Flutter Android Build CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'milkyway-main/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'milkyway-main/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Check Environment Versions
        run: |
          java -version
          flutter --version

      - name: Install Dependencies
        working-directory: milkyway-main
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: milkyway-main
        run: flutter build apk --release

      - name: Build Android Release App Bundle (AAB)
        working-directory: milkyway-main
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: milkyway-main/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: milkyway-main/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
